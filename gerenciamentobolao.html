<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciamento do bolão · X1 do Santa</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0505">
<link rel="icon" href="img/logo-x1-do-santa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<!-- ============ SEÇÃO 1 · CABEÇALHO ============ -->
<header id="secao-cabecalho" class="wrap">
  <a class="logo-link" href="./" aria-label="Ir para o site do X1 do Santa">
    <img class="logo" src="img/logo-x1-do-santa.png" alt="X1 do Santa">
  </a>
  <div class="proximo">
    <h1 class="titulo-ouro" style="font-size:clamp(26px,7vw,48px)">Gerenciamento do bolão</h1>
    <div class="risco"></div>
  </div>
</header>

<main class="wrap">

  <!-- ============ SEÇÃO 2 · AVISOS ============
       Sem login: o acesso é o próprio link do organizador (a chave vai depois do #). -->
  <section id="secao-acesso" aria-label="Avisos">
    <p class="msg" id="g-msg" role="status" hidden></p>
  </section>

  <!-- ============ SEÇÃO 3 · PARTICIPANTES E PAGAMENTOS ============ -->
  <section id="secao-lista" aria-labelledby="t-lista" hidden>
    <div class="faixa-titulo"><h2 id="t-lista">Participantes</h2></div>
    <div class="resumo" id="g-resumo"></div>
    <div class="ger-filtros">
      <input id="g-busca" type="search" placeholder="Buscar por número, nome ou WhatsApp" aria-label="Buscar participante">
      <select id="g-filtro" aria-label="Filtrar por pagamento">
        <option value="todos">Todos</option>
        <option value="pendentes">Aguardando pagamento</option>
        <option value="pagos">Pagos</option>
      </select>
    </div>
    <p class="rota"><a class="pincel vermelho" id="g-atualizar" role="button" tabindex="0">Atualizar lista</a></p>
    <ul class="ger-lista" id="g-lista"></ul>
  </section>

</main>

<!-- ============ SEÇÃO 4 · RODAPÉ ============ -->
<footer>
  <strong class="f-azul">Real Santa Clara</strong>
  <span class="f-frase">Área restrita ao organizador do bolão.</span>
</footer>

<script src="data.js"></script>
<script src="comum.js"></script>
<script src="gerenciamento.js"></script>
</body>
</html>
